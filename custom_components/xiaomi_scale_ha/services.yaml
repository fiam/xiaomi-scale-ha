respond_pending:
  name: Respond to pending measurement
  description: Claim or decline a reading as the scale profile linked to your signed-in Home Assistant account.
  fields:
    measurement_id:
      name: Measurement ID
      required: true
      selector:
        text:
    decision:
      name: Response
      required: true
      selector:
        select:
          options:
            - claim
            - decline
    entry_id:
      name: Entry ID
      selector:
        text:

assign_pending:
  name: Assign pending measurement
  description: Assign a specific pending scale measurement to a configured user.
  fields:
    measurement_id:
      name: Measurement ID
      description: ID from the pending measurement sensor. Old notifications cannot target a newer reading.
      required: true
      selector:
        text:
    entry_id:
      name: Entry ID
      description: Optional config entry ID. Required only when multiple scales are configured.
      selector:
        text:
    user_name:
      name: User name
      description: Configured user name to assign the pending measurement to.
      required: true
      selector:
        text:

discard_pending:
  name: Discard pending measurement
  description: Discard a specific pending scale measurement.
  fields:
    measurement_id:
      name: Measurement ID
      description: ID from the pending measurement sensor. Old notifications cannot target a newer reading.
      required: true
      selector:
        text:
    entry_id:
      name: Entry ID
      description: Optional config entry ID. Required only when multiple scales are configured.
      selector:
        text:
    reason:
      name: Reason
      description: Optional reason stored in the discarded event.
      selector:
        text:

send_pending_notification:
  name: Send pending notification
  description: Send the notification for the current pending measurement again.
  fields:
    entry_id:
      name: Entry ID
      description: Optional config entry ID. Required only when multiple scales are configured.
      selector:
        text:

clear_history:
  name: Clear history
  description: Clear all stored history, or only one configured user's history.
  fields:
    entry_id:
      name: Entry ID
      description: Optional config entry ID. Required only when multiple scales are configured.
      selector:
        text:
    user_name:
      name: User name
      description: Optional configured user name. Leave empty to clear all users.
      selector:
        text:

delete_history_measurement:
  name: Delete history measurement
  description: Delete one stored measurement for a configured user by index.
  fields:
    entry_id:
      name: Entry ID
      description: Optional config entry ID. Required only when multiple scales are configured.
      selector:
        text:
    user_name:
      name: User name
      description: Configured user name.
      required: true
      selector:
        text:
    index:
      name: Index
      description: Measurement index to delete. Use -1 for the latest measurement.
      required: true
      selector:
        number:
          min: -10
          max: 9
          mode: box
